server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Clean URLs: /app → app.html, /agent → agent.html, /dashboard → dashboard.html, /docs → docs.html
    location = /app {
        try_files /app.html =404;
    }

    location = /agent {
        try_files /agent.html =404;
    }

    location = /dashboard {
        try_files /dashboard.html =404;
    }

    location = /docs {
        try_files /docs.html =404;
    }

    # Legacy /vt220 routes — the VT220 design is now the default site.
    # 301 redirects preserve deep-linked shares + search engine juice.
    location = /vt220            { return 301 /; }
    location = /vt220/agent      { return 301 /agent; }
    location = /vt220/docs       { return 301 /docs; }
    location = /vt220/dashboard  { return 301 /dashboard; }

    # Legal pages: serve index.html and let the browser scroll to the anchor
    location = /privacy {
        rewrite ^ /#privacy redirect;
    }

    location = /terms {
        rewrite ^ /#terms redirect;
    }

    # Default: serve files normally
    location / {
        try_files $uri $uri/ =404;
    }
}
